<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio de Sesión</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

   <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="logo" class="mb-4 ps-3">
  <img src="image/FLUX_Logo.png" alt="logo" width="120">
</div>

  <main class="container">
    <h2 class="text-center mb-3">Inicio de sesión</h2>

    <form id="loginForm">

      <div class="mb-3">
        <label class="form-label">Email:</label>
        <input id="email" type="email" class="form-control" placeholder="admi@gmail.com" required>
      </div>

      <div class="mb-3">
        <label  class="form-label">Contraseña:</label>
        <input id="password" type="password" class="form-control" placeholder="contraseña:1234" required>
      </div>

      <button id="login" type="submit" class="btn w-100 mt-3">Iniciar sesión</button>
       
      <p id="mensaje" class="text-center mt-3" ></p>

    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app/billetera.js"></script>
</body>

</html>
